<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Market movements</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main>
      <header class="page-header">
        <div>
          <p class="eyebrow">Yahoo Finance screener</p>
          <h1>Market movements</h1>
          <p id="updated">Loading data...</p>
        </div>

        <button id="refresh-button" type="button">
          Refresh
        </button>
      </header>

      <section class="settings">
        <div>
          <h2>Thresholds</h2>
          <p>
            Show instruments moving less than the selected daily percentage.
          </p>
        </div>

        <form id="threshold-form" class="threshold-form">
          <div id="threshold-inputs" class="threshold-inputs"></div>

          <div class="threshold-actions">
            <button id="reset-button" type="button" class="secondary-button">
              Reset defaults
            </button>

            <button type="submit">
              Apply thresholds
            </button>
          </div>
        </form>
      </section>

      <section
        id="status"
        class="status"
        aria-live="polite"
      >
        Loading market data...
      </section>

      <div id="categories"></div>
      <div id="errors"></div>
    </main>

    <script src="./screener.js"></script>
  </body>
</html>
