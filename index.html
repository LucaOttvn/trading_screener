<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market ranges</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #17202a;
      }

      body {
        margin: 0;
      }

      main {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      h1 {
        margin: 0 0 8px;
      }

      .updated {
        margin: 0 0 28px;
        color: #68737d;
      }

      .status {
        padding: 16px;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 2px 8px rgb(0 0 0 / 8%);
      }

      .categories {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
      }

      .category {
        overflow: hidden;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 2px 8px rgb(0 0 0 / 8%);
      }

      .category-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px;
        border-bottom: 1px solid #e5e9ec;
      }

      .category-header h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .count {
        min-width: 24px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #e8f1ff;
        color: #1769d1;
        font-size: 0.85rem;
        text-align: center;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      th,
      td {
        padding: 11px 14px;
        border-bottom: 1px solid #edf0f2;
        text-align: right;
        white-space: nowrap;
      }

      th:first-child,
      td:first-child,
      th:nth-child(2),
      td:nth-child(2) {
        text-align: left;
      }

      th {
        background: #fafbfc;
        color: #68737d;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .symbol {
        font-weight: 700;
      }

      .empty {
        padding: 22px 18px;
        color: #68737d;
      }

      .errors {
        margin-top: 28px;
        padding: 16px 18px;
        border: 1px solid #f1caca;
        border-radius: 10px;
        background: #fff6f6;
      }

      .errors h2 {
        margin: 0 0 10px;
        color: #a42626;
        font-size: 1rem;
      }

      .errors ul {
        margin: 0;
        padding-left: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Market ranges</h1>
      <p id="updated" class="updated">Loading data...</p>

      <div id="status" class="status">Loading market data...</div>
      <div id="categories" class="categories"></div>
      <div id="errors"></div>
    </main>

    <script>
      const DATA_URL = "./outputs/market-ranges.json";

      const updatedElement = document.querySelector("#updated");
      const statusElement = document.querySelector("#status");
      const categoriesElement = document.querySelector("#categories");
      const errorsElement = document.querySelector("#errors");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatNumber(value) {
        return Number(value).toLocaleString(undefined, {
          maximumFractionDigits: 6,
        });
      }

      function renderCategory(category, data) {
        const symbols = Array.isArray(data.symbols) ? data.symbols : [];
        const rows = symbols
          .map(
            (item) => `
              <tr>
                <td class="symbol">${escapeHtml(item.symbol)}</td>
                <td>${escapeHtml(item.date)}</td>
                <td>${formatNumber(item.range_in_percentage)}%</td>
                <td>${formatNumber(item.open)}</td>
                <td>${formatNumber(item.high)}</td>
                <td>${formatNumber(item.low)}</td>
                <td>${formatNumber(item.close)}</td>
              </tr>
            `
          )
          .join("");

        return `
          <section class="category">
            <div class="category-header">
              <h2>${escapeHtml(data.label || category)}</h2>
              <span class="count">${symbols.length}</span>
            </div>
            ${
              symbols.length
                ? `
                  <div class="table-wrapper">
                    <table>
                      <thead>
                        <tr>
                          <th>Symbol</th>
                          <th>Date</th>
                          <th>Range</th>
                          <th>Open</th>
                          <th>High</th>
                          <th>Low</th>
                          <th>Close</th>
                        </tr>
                      </thead>
                      <tbody>${rows}</tbody>
                    </table>
                  </div>
                `
                : '<div class="empty">No symbols below the threshold.</div>'
            }
          </section>
        `;
      }

      function renderErrors(errors) {
        if (!Array.isArray(errors) || errors.length === 0) {
          return;
        }

        errorsElement.innerHTML = `
          <section class="errors">
            <h2>Errors</h2>
            <ul>
              ${errors
                .map(
                  (error) => `
                    <li>
                      ${escapeHtml(error.symbol)}:
                      ${escapeHtml(error.message)}
                    </li>
                  `
                )
                .join("")}
            </ul>
          </section>
        `;
      }

      async function loadData() {
        try {
          const response = await fetch(DATA_URL);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();
          const categories = data.categories || data;

          statusElement.remove();

          if (data.generated_at) {
            updatedElement.textContent =
              `Generated: ${new Date(data.generated_at).toLocaleString()}`;
          } else {
            updatedElement.textContent = "Market data";
          }

          categoriesElement.innerHTML = Object.entries(categories)
            .map(([category, categoryData]) =>
              renderCategory(category, categoryData)
            )
            .join("");

          renderErrors(data.errors);
        } catch (error) {
          statusElement.textContent =
            `Could not load market data: ${error.message}`;
          statusElement.style.color = "#a42626";
        }
      }

      loadData();
    </script>
  </body>
</html>
